name: Android preview

# Runs the app on an Android emulator, walks through every screen, and commits the screenshots
# to android/preview/ on the same branch.
on:
  push:
    paths:
      - ".github/workflows/android-preview.yml"
      - ".github/scripts/preview.sh"
      - ".github/scripts/find_node.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Hardware acceleration for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/preview.sh

      - name: Commit the screenshots
        if: always()
        run: |
          [ -d preview ] || exit 0
          rm -rf android/preview
          mkdir -p android/preview
          cp preview/*.png preview/steps.txt preview/crash.txt preview/logcat.txt android/preview/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/preview
          git commit -m "Add Android emulator screenshots of the app [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: preview
          if-no-files-found: ignore
